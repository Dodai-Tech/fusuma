name: Web screenshots

# The web showcase, in a headless browser, against what the native renderer draws for the same start: every page in
# both modes and the open dropdown. Nightly, and on demand; the quality gate on every push and pull request is CI.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: "10"

jobs:
  screenshots:
    name: web screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable and the wasm target
        run: |
          for i in 1 2 3 4 5; do
            curl --proto '=https' --tlsv1.2 -sSf --retry 5 --retry-all-errors --retry-delay 5 https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal && break
            [ $i = 5 ] && exit 1
            echo "rustup install failed, retrying..."; sleep 15
          done
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          . "$HOME/.cargo/env"
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install Nushell
        run: |
          V=0.116.1
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/nu.tgz https://github.com/nushell/nushell/releases/download/$V/nu-$V-x86_64-unknown-linux-gnu.tar.gz && tar -xzf /tmp/nu.tgz -C /tmp
          sudo install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu || { mkdir -p $HOME/.cargo/bin; install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu $HOME/.cargo/bin/nu; }
          nu --version
      - name: Install wasm-bindgen
        run: nu scripts/web.nu install
      - name: Install a browser and ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick chromium || sudo apt-get install -y imagemagick chromium-browser
      - name: Compare the screenshots
        run: nu scripts/web_shots.nu
      - name: Upload the pictures
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: web-screenshots
          path: target/web-shots/
