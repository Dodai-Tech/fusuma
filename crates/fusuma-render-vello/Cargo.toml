[package]
name = "fusuma-render-vello"
description = "Fusuma renderer backend for desktops and phones with a GPU: anti-aliased drawing on vello_gpu and wgpu"
readme = "README.md"
documentation = "https://docs.rs/fusuma-render-vello"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Vector fonts for `draw_text` and `measure_text` (bundled by `fusuma-text`).
text = ["fusuma-render-vello-common/text", "vello_gpu/text", "dep:fusuma-text", "dep:glifo"]
# The bundled fonts, each implying `text`: see `fusuma-fonts`.
inter = ["text", "fusuma-text/inter"]
inter-bold = ["text", "fusuma-text/inter-bold"]
jetbrains-mono = ["text", "fusuma-text/jetbrains-mono"]

[dependencies]
fusuma-render-vello-common = { workspace = true, features = ["std"] }
vello_gpu.workspace = true
fusuma-text = { workspace = true, optional = true }
glifo = { version = "0.5", default-features = false, features = ["std"], optional = true }
pollster.workspace = true
wgpu.workspace = true

[dev-dependencies]
fusuma-render = { workspace = true, features = ["conformance"] }
fusuma-render-embedded.workspace = true
# `inter`: the GPU text test compares against the CPU drawing the same font.
fusuma-render-vello-cpu = { workspace = true, features = ["std", "inter"] }

[lints]
workspace = true
