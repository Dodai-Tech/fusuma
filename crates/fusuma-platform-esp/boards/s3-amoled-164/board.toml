# The Waveshare ESP32-S3-Touch-AMOLED-1.64 (280x456): the pins were found on a real board (an I2C scan answers at
# 0x38, the FT3168, and 0x6b, the IMU, only on SDA 47 / SCL 48) and checked against Waveshare's Rust examples
# (melastmohican/rust-waveshare-esp32s3-touch-amoled164-examples) and the weathertrack-esp firmware that runs on it.
name = "s3-amoled-164"
title = "Waveshare ESP32-S3-Touch-AMOLED-1.64"
about = "Waveshare ESP32-S3-Touch-AMOLED-1.64 (280x456)"
capabilities = ["display", "touch", "button", "wifi", "ble", "battery", "imu", "storage"]

[display]
width = 280
height = 456
shape = "rect"
# The panel's memory is 20 columns wider on the left than what is visible.
offset = [20, 0]
# The CO5300 takes rectangles that start and end on even columns and rows.
grid = 2
controller = "co5300"
bus = "qspi"
# Two PCB revisions: chip select is GPIO9 on V1 and GPIO46 on V2. On the board this was measured on, GPIO9 alone showed
# nothing and driving both lit the panel, so it is a V2: 46. Use 9 for a V1 board.
pins = { sck = 10, d = [11, 12, 13, 14], cs = 46, rst = 21 }
# 10 MHz is what was proven on the glass; the 2.06 runs 80. The first try here ran at 40 and showed nothing, so raise it
# in steps and measure.
options = { pclk_mhz = 10 }

[screen]
form = "watch"
width_mm = 22
height_mm = 36
kind = "emissive"
inputs = ["touch"]

[touch]
controller = "ft3168"
bus = "i2c"
# The FT3168 needs its reset (GPIO8, active low) pulsed before it reports a finger: without it every read is empty.
pins = { sda = 47, scl = 48, rst = 8 }

[firmware]
chip = "esp32s3"
flash_mb = 16

# What the chip has: an ESP32-S3R8 (8 MB octal PSRAM).
[hardware]
ram_kb = 512
psram_kb = 8192
fpu = true
simd = false
