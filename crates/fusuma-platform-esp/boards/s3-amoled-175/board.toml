# The Waveshare ESP32-S3-Touch-AMOLED-1.75 (466x466 round, a CO5300 with a CST9217 touch): the 1.75C's sibling with other pins for the panel
# and touch resets (the C: 1 and 2; this one: 39 and 40). NOT RUN ON A BOARD: read from Waveshare's HARDWARE_REFERENCE.md and Arduino
# examples (waveshareteam/ESP32-S3-Touch-AMOLED-1.75); the same board is sold with a case (-B) and with a GPS module (-G). Schema:
# crates/fusuma-platform/board.schema.json.
name = "s3-amoled-175"
title = "Waveshare ESP32-S3-Touch-AMOLED-1.75"
about = "Waveshare ESP32-S3 1.75-inch round AMOLED touch board (466x466, CO5300)"
capabilities = ["display", "touch", "button", "wifi", "ble", "battery", "rtc", "imu", "storage", "audio"]

[display]
width = 466
height = 466
shape = "circle"
# The panel's memory is 6 columns wider on the left than what is visible.
offset = [6, 0]
grid = 2
controller = "co5300"
bus = "qspi"
pins = { sck = 38, d = [4, 5, 6, 7], cs = 12, rst = 39 }
options = { pclk_mhz = 40 }

[screen]
form = "watch"
width_mm = 44
height_mm = 44
kind = "emissive"
inputs = ["touch"]

[touch]
controller = "cst92xx"
bus = "i2c"
pins = { sda = 15, scl = 14, rst = 40, int = 11 }

[firmware]
chip = "esp32s3"
flash_mb = 16

[hardware]
ram_kb = 512
psram_kb = 8192
fpu = true
simd = false
