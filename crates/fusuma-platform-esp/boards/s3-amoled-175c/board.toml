# The Waveshare ESP32-S3-Touch-AMOLED-1.75C (466x466 round, a CO5300 with a CST9217 touch). NOT RUN ON A BOARD: read from
# Waveshare's Arduino examples (waveshareteam/ESP32-S3-Touch-AMOLED-1.75C). Schema: crates/fusuma-platform/board.schema.json.
name = "s3-amoled-175c"
title = "Waveshare ESP32-S3-Touch-AMOLED-1.75C"
about = "Waveshare ESP32-S3 1.75-inch round AMOLED touch board (466x466, CO5300)"
capabilities = ["display", "touch", "button", "wifi", "ble", "battery", "rtc", "imu", "storage", "audio"]

[display]
width = 466
height = 466
shape = "circle"
# The panel's memory is 6 columns wider on the left than what is visible.
offset = [6, 0]
grid = 2
controller = "co5300"
bus = "qspi"
pins = { sck = 38, d = [4, 5, 6, 7], cs = 12, rst = 1 }
options = { pclk_mhz = 40 }

[screen]
form = "watch"
width_mm = 44
height_mm = 44
kind = "emissive"
inputs = ["touch"]

[touch]
controller = "cst92xx"
bus = "i2c"
pins = { sda = 15, scl = 14, rst = 2, int = 11 }

[firmware]
chip = "esp32s3"
flash_mb = 32
# 32 MB flash and 8 MB octal PSRAM (README). The bootloader may only boot a slot in the first 16 MB, as on the 2.06.
boot_limit_mb = 16

[hardware]
ram_kb = 512
psram_kb = 8192
fpu = true
simd = false
