# The Waveshare ESP32-C6-Touch-AMOLED-1.43 (466x466 round, a CO5300 with an FT3168 touch). NOT RUN ON A BOARD: read from Waveshare's
# examples (waveshareteam/ESP32-C6-Touch-AMOLED-1.43, its factory program: the CO5300 start-up and the 6 column offset). Unlike the S3's
# 1.43 it has one start-up in its firmware, so no ID probe. Schema: crates/fusuma-platform/board.schema.json.
# MEMORY: a C6 has 512 KB and no PSRAM; the colour surface of this screen (434 KB at 16 bits a pixel) may not fit beside the
# firmware; if it does not, the build or the first start says so (the choice of renderer is made from the free memory).
name = "c6-amoled-143"
title = "Waveshare ESP32-C6-Touch-AMOLED-1.43"
about = "Waveshare ESP32-C6 1.43-inch AMOLED touch board (466x466, CO5300)"
capabilities = ["display", "touch", "button", "wifi", "ble", "battery", "rtc", "imu", "storage"]

[display]
width = 466
height = 466
shape = "circle"
offset = [6, 0]
grid = 2
controller = "co5300"
bus = "qspi"
pins = { sck = 11, d = [4, 5, 6, 7], cs = 10, rst = 3 }
options = { pclk_mhz = 40 }

[screen]
form = "watch"
width_mm = 36
height_mm = 36
kind = "emissive"
inputs = ["touch"]

[touch]
controller = "ft3168"
bus = "i2c"
pins = { sda = 18, scl = 8 }

[firmware]
chip = "esp32c6"
flash_mb = 16

[hardware]
ram_kb = 512
psram_kb = 0
fpu = false
simd = false
