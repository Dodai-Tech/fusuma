# The Waveshare ESP32-S3-Touch-AMOLED-1.43 (466x466, round). NOT RUN ON A BOARD: every value is read from Waveshare's own
# firmware (waveshareteam/ESP32-S3-Touch-AMOLED-1.43, examples/esp-idf/08_LVGL_SDIMG), the way s3-amoled-164 was before it
# was flashed. Treat it as a starting point and measure.
#
# The board ships with one of two panels, told apart at run time by reading the panel ID: an SH8601 (column offset 0, a
# different init with `44 01 D1`) or a CO5300 (column offset 6, the init this crate's driver sends). This file is the
# CO5300 variant; the SH8601 one needs a driver option that does not exist yet.
name = "s3-amoled-143"
title = "Waveshare ESP32-S3-Touch-AMOLED-1.43"
about = "Waveshare ESP32-S3-Touch-AMOLED-1.43 round watch (466x466, CO5300 variant)"
capabilities = ["display", "touch", "button", "wifi", "ble", "battery", "rtc", "imu", "storage"]

[display]
width = 466
height = 466
shape = "circle"
offset = [6, 0]
grid = 2
controller = "co5300"
bus = "qspi"
pins = { sck = 10, d = [11, 12, 13, 14], cs = 9, rst = 21 }
# Start low and raise it in steps (the 1.64 showed nothing at 40 MHz with a wrong chip select, so the clock was never the proof).
options = { pclk_mhz = 10 }

[screen]
form = "watch"
width_mm = 36
height_mm = 36
kind = "emissive"
inputs = ["touch"]

[touch]
controller = "ft3168"
bus = "i2c"
# The vendor's touch driver passes reset -1: there is no reset line to pulse (unlike the 1.64, which needs GPIO8).
pins = { sda = 47, scl = 48 }

[firmware]
chip = "esp32s3"
# Waveshare's product page lists 16 MB; its examples build for 4 MB. Not measured here.
flash_mb = 16

[hardware]
ram_kb = 512
psram_kb = 8192
fpu = true
simd = false
