[package]
name = "fusuma-platform-esp"
description = "Fusuma on ESP-IDF boards: the display, touch and frame loop, and the renderer picked from the chip's memory (today the Waveshare ESP32-P4 7-inch board)"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Sorin Albu-Irimies"]
repository = "https://github.com/Dodai-Tech/fusuma"
keywords = ["gui", "esp32", "embedded", "touch"]
categories = ["gui", "embedded"]
publish = false

# Not a member of the Fusuma workspace: it needs the ESP toolchain, so it builds as part of a firmware.
[workspace]

[features]
default = ["skia", "vello-cpu"]
# Link the `tiny-skia` and the `vello_cpu` renderers next to the integer one, which is always there.
# Leaving both off links the integer renderer only (the smallest firmware).
skia = ["dep:fusuma-render-skia"]
vello-cpu = ["dep:fusuma-render-vello-cpu"]

[dependencies]
fusuma = { path = "../fusuma" }
fusuma-platform = { path = "../fusuma-platform", features = ["toml"] }
fusuma-render = { path = "../fusuma-render" }
fusuma-render-embedded = { path = "../fusuma-render-embedded" }
fusuma-render-skia = { path = "../fusuma-render-skia", optional = true, default-features = false, features = ["std"] }
fusuma-render-vello-cpu = { path = "../fusuma-render-vello-cpu", optional = true, default-features = false, features = ["std"] }
esp-idf-svc = { version = "0.53", features = ["experimental"] }
log = "0.4"
anyhow = "1"
