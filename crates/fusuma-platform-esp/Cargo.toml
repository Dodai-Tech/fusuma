[package]
name = "fusuma-platform-esp"
description = "Fusuma on ESP-IDF boards: the display, touch and frame loop, and the renderer picked from the chip's memory (the Waveshare ESP32-P4 7-inch board and ESP32-S3 AMOLED 2.06 watch)"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Sorin Albu-Irimies"]
repository = "https://github.com/Dodai-Tech/fusuma"
keywords = ["gui", "esp32", "embedded", "touch"]
categories = ["gui", "embedded"]
publish = false

# Not a member of the Fusuma workspace: it needs the ESP toolchain, so it builds as part of a firmware.
[workspace]

[features]
default = ["skia", "vello-cpu", "fonts"]
# The board, exactly one. Its C shim (components/<board>) must be listed in the firmware's
# `package.metadata.esp-idf-sys.extra_components`; see examples/showcase-esp.
board-p4-7in = []
board-s3-amoled-206 = []
# Link the `tiny-skia` and the `vello_cpu` renderers next to the integer one, which is always there.
# Leaving both off links the integer renderer only (the smallest firmware).
skia = ["fusuma/renderer-skia", "fusuma-platform-embedded/skia"]
vello-cpu = ["fusuma/renderer-vello-cpu", "fusuma-platform-embedded/vello-cpu"]
# Vector fonts (Inter, Inter Bold, JetBrains Mono: about 215 KB of flash) for the Vello renderers. Without it text is
# the bitmap font. The integer and `tiny-skia` renderers always draw the bitmap font.
fonts = ["fusuma/font-inter", "fusuma/font-inter-bold", "fusuma/font-jetbrains-mono"]

[dependencies]
fusuma-platform-embedded = { path = "../fusuma-platform-embedded", features = ["std"] }
fusuma = { path = "../fusuma", default-features = false, features = ["std", "toml", "renderer-integer"] }
esp-idf-svc = { version = "0.53", features = ["experimental"] }
log = "0.4"
anyhow = "1"
