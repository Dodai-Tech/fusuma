[package]
name = "fusuma-platform-esp"
description = "Fusuma on ESP-IDF boards: drivers per controller (CO5300, EK79007, GT911, FT3168, LEDC backlight), a board described by one TOML file, the frame loop and the renderer choice"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Sorin Albu-Irimies"]
repository = "https://github.com/Dodai-Tech/fusuma"
keywords = ["gui", "esp32", "embedded", "touch"]
categories = ["gui", "embedded"]
publish = false

# Not a member of the Fusuma workspace: it needs the ESP toolchain, so it builds as part of a firmware.
[workspace]

[features]
# The integer renderer with smooth text: what the automatic choice picks on every ESP chip (Vello has no SIMD there).
# `vello-cpu` links Vello for a board that pins it in its `fusuma.toml`; without `fonts` text is the bitmap font.
default = ["fonts"]
# Link the `vello_cpu` renderer next to the integer one, which is always there.
vello-cpu = ["fusuma/renderer-vello-cpu", "fusuma-platform-embedded/vello-cpu"]
# Smooth text with the default preset (Inter, JetBrains Mono): glyph atlases for the integer renderer (about 125 KB of
# flash) and, with `vello-cpu`, the font files for Vello. Other families: the firmware turns on `fusuma/fonts-*` or
# `fusuma-fonts/<family>` and picks them in `[fonts]`. Without it text is the bitmap font.
fonts = ["fusuma/fonts-fusuma", "fusuma-platform-embedded/fonts"]
# Every font family of the catalog (about 600 KB of atlases), so `[fonts]` can pick any preset.
all-fonts = ["fonts", "fusuma/fonts-all"]

[dependencies]
fusuma-platform-embedded = { path = "../fusuma-platform-embedded", features = ["std"] }
fusuma = { path = "../fusuma", default-features = false, features = ["std", "toml", "renderer-integer"] }
esp-idf-svc = { version = "0.53", features = ["experimental"] }
log = "0.4"
anyhow = "1"

# The board file (FUSUMA_BOARD) is read and checked at build time with Fusuma's own parser.
[build-dependencies]
fusuma-platform = { path = "../fusuma-platform", features = ["toml"] }
