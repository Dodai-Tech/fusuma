[package]
name = "fusuma-platform"
description = "Fusuma's out-of-the-box choice of renderer: which backend a machine draws with, from its hardware, with overrides and a memory check (no_std, no dependencies)"
readme = "README.md"
documentation = "https://docs.rs/fusuma-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["gui", "renderer", "embedded", "no-std", "hardware"]
categories = ["gui", "embedded", "no-std"]

[features]
# Reading settings from TOML: the `[render]` table and a whole settings file (`fusuma.toml`). Needs `std`.
toml = ["dep:toml", "dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }
toml = { workspace = true, optional = true }

[lints]
workspace = true
