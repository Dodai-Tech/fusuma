    "stop", "skip_next=skip-forward", "skip_previous=skip-back", "timer", "schedule=clock",
    "calendar_today=calendar", "mail=envelope", "call=phone", "chat=chat-circle", "share=share-network",
    "download=download-simple", "upload=upload-simple", "folder", "image", "photo_camera=camera",
    "map=map-trifold", "location_on=map-pin", "directions_car=car", "ev_station=charging-station",
    "thermostat=thermometer", "water_drop=drop", "sunny=sun-dim", "cloud", "bolt=lightning",
