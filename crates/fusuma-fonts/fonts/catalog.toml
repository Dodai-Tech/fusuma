    "remove=minus", "delete=trash", "edit=pencil-simple", "arrow_back=arrow-left",
    "arrow_forward=arrow-right", "arrow_upward=arrow-up", "arrow_downward=arrow-down",
    "chevron_left=caret-left", "chevron_right=caret-right", "expand_more=caret-down", "expand_less=caret-up",
    "more_vert=dots-three-vertical", "more_horiz=dots-three", "refresh=arrow-clockwise", "info", "warning",
    "error=warning-circle", "help=question", "notifications=bell", "favorite=heart", "star", "person=user",
