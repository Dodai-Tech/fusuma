# The font families Fusuma can bundle, and the presets that map them to the roles a theme uses (sans, its bold, mono).
# Each family is a cargo feature of fusuma-fonts with the same name (opt-in); a preset is a feature `preset-<id>` that
# turns its families on. `nu scripts/fonts.nu fetch` downloads a family from `url`, cuts static instances from a
# variable font (`axes`), subsets it to `coverage` and writes `<id>/regular.ttf`, `<id>/bold.ttf` and `<id>/OFL.txt`;
# the results are committed. Every family here is under the SIL Open Font License 1.1.

[defaults]
# The characters every family is cut to: ASCII, Latin-1, Latin Extended-A, the Romanian comma-below letters, common
# punctuation, the euro sign, four arrows and the minus sign.
coverage = "U+0020-007E, U+00A0-017F, U+0218-021B, U+2013-2014, U+2018-201E, U+2022, U+2026, U+20AC, U+2190-2193, U+2212"
# Line heights in pixels the glyph atlases are made at, unless the app's `[fonts] sizes` says otherwise.
sizes = [10, 15, 20]

# ── Sans ─────────────────────────────────────────────────────────────────────────────────────────────────────────

[[family]]
id = "inter"
name = "Inter"
role = "sans"
about = "Fusuma's default: a screen face with a tall x-height"
url = "https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip"
regular = "Inter-Regular.ttf"
bold = "Inter-Bold.ttf"

[[family]]
id = "roboto"
name = "Roboto"
role = "sans"
about = "Android's and Material's face"
url = "https://github.com/google/fonts/raw/main/ofl/roboto/Roboto%5Bwdth,wght%5D.ttf"
axes = { wdth = 100 }

[[family]]
id = "atkinson-hyperlegible"
name = "Atkinson Hyperlegible Next"
role = "sans"
about = "Made for legibility: letters that cannot be confused (I l 1, O 0), good on small screens"
url = "https://github.com/google/fonts/raw/main/ofl/atkinsonhyperlegiblenext/AtkinsonHyperlegibleNext%5Bwght%5D.ttf"

[[family]]
id = "ibm-plex-sans"
name = "IBM Plex Sans"
role = "sans"
about = "A neutral grotesque with Mono and Serif siblings"
url = "https://github.com/google/fonts/raw/main/ofl/ibmplexsans/IBMPlexSans%5Bwdth,wght%5D.ttf"
axes = { wdth = 100 }

[[family]]
id = "noto-sans"
name = "Noto Sans"
role = "sans"
about = "Google's face for every script; cut to Latin here like the others"
url = "https://github.com/google/fonts/raw/main/ofl/notosans/NotoSans%5Bwdth,wght%5D.ttf"
axes = { wdth = 100 }

# ── Mono ─────────────────────────────────────────────────────────────────────────────────────────────────────────

[[family]]
id = "jetbrains-mono"
name = "JetBrains Mono"
role = "mono"
about = "Fusuma's default mono"
url = "https://github.com/JetBrains/JetBrainsMono/releases/download/v2.304/JetBrainsMono-2.304.zip"
regular = "JetBrainsMono-Regular.ttf"

[[family]]
id = "roboto-mono"
name = "Roboto Mono"
role = "mono"
about = "Roboto's mono"
url = "https://github.com/google/fonts/raw/main/ofl/robotomono/RobotoMono%5Bwght%5D.ttf"

[[family]]
id = "atkinson-hyperlegible-mono"
name = "Atkinson Hyperlegible Mono"
role = "mono"
about = "Atkinson Hyperlegible's mono"
url = "https://github.com/google/fonts/raw/main/ofl/atkinsonhyperlegiblemono/AtkinsonHyperlegibleMono%5Bwght%5D.ttf"

[[family]]
id = "ibm-plex-mono"
name = "IBM Plex Mono"
role = "mono"
about = "IBM Plex's mono"
url = "https://github.com/google/fonts/raw/main/ofl/ibmplexmono/IBMPlexMono-Regular.ttf"

[[family]]
id = "noto-sans-mono"
name = "Noto Sans Mono"
role = "mono"
about = "Noto's mono"
url = "https://github.com/google/fonts/raw/main/ofl/notosansmono/NotoSansMono%5Bwdth,wght%5D.ttf"
axes = { wdth = 100 }

# ── Presets: the first one whose families are linked is the default ──────────────────────────────────────────────

[[preset]]
id = "fusuma"
about = "Inter and JetBrains Mono"
sans = "inter"
mono = "jetbrains-mono"

[[preset]]
id = "material"
about = "Roboto and Roboto Mono, the Android and Material look"
sans = "roboto"
mono = "roboto-mono"

[[preset]]
id = "legible"
about = "Atkinson Hyperlegible Next and Mono, for small screens and low vision"
sans = "atkinson-hyperlegible"
mono = "atkinson-hyperlegible-mono"

[[preset]]
id = "plex"
about = "IBM Plex Sans and Mono"
sans = "ibm-plex-sans"
mono = "ibm-plex-mono"

[[preset]]
id = "noto"
about = "Noto Sans and Noto Sans Mono"
sans = "noto-sans"
mono = "noto-sans-mono"

# ── Icons: drawn like text, one character an icon, looked up by name ─────────────────────────────────────────────

[[family]]
id = "material-symbols"
name = "Material Symbols Rounded"
role = "icons"
about = "Google's Material Symbols, Rounded style, outlined, weight 400 (Apache 2.0)"
url = "https://github.com/google/material-design-icons/raw/master/variablefont/MaterialSymbolsRounded%5BFILL,GRAD,opsz,wght%5D.ttf"
codepoints_url = "https://github.com/google/material-design-icons/raw/master/variablefont/MaterialSymbolsRounded%5BFILL,GRAD,opsz,wght%5D.codepoints"
licence_url = "https://raw.githubusercontent.com/google/material-design-icons/master/LICENSE"
axes = { FILL = 0, GRAD = 0, opsz = 24 }
# Only these are cut out of the 4,000; add a name and run `just fonts-fetch family=material-symbols --force`.
icons = [
    "home", "settings", "search", "menu", "close", "check", "add", "remove", "delete", "edit",
    "arrow_back", "arrow_forward", "arrow_upward", "arrow_downward", "chevron_left", "chevron_right",
    "expand_more", "expand_less", "more_vert", "more_horiz", "refresh", "info", "warning", "error", "help",
    "notifications", "favorite", "star", "person", "lock", "lock_open", "visibility", "visibility_off",
    "wifi", "bluetooth", "battery_full", "battery_charging_full", "light_mode", "dark_mode", "palette",
    "volume_up", "volume_off", "play_arrow", "pause", "stop", "skip_next", "skip_previous", "timer", "schedule",
    "calendar_today", "mail", "call", "chat", "share", "download", "upload", "folder", "image", "photo_camera",
    "map", "location_on", "directions_car", "ev_station", "thermostat", "water_drop", "sunny", "cloud", "bolt",
    "power_settings_new", "logout", "login", "sync", "tune", "filter_list", "sort", "list", "grid_view",
    "dashboard", "check_circle", "cancel", "radio_button_checked", "radio_button_unchecked", "check_box",
    "check_box_outline_blank", "toggle_on", "toggle_off", "keyboard", "text_fields", "brightness_6", "language",
    "translate",
]

# Two more icon families, opt-in (`lucide`, `phosphor` features; `[fonts] icons = "lucide"`). Each lists the same icons
# as Material Symbols by the name an app asks for: `home=house` means the app says `home` and the font calls it
# `house`. They are line (Lucide) and outline (Phosphor) icons, so a design can pick its drawing style.

[[family]]
id = "lucide"
name = "lucide"
role = "icons"
about = "Lucide, line icons on a 24 px grid (ISC, with parts MIT from Feather)"
url = "https://unpkg.com/lucide-static@1.80.0/font/lucide.ttf"
codepoints_url = "https://unpkg.com/lucide-static@1.80.0/font/info.json"
codepoints_format = "lucide"
# Its GSUB table is one fonttools cannot read; an icon font needs no layout, so it is dropped before cutting.
drop_tables = ["GSUB"]
licence_url = "https://raw.githubusercontent.com/lucide-icons/lucide/main/LICENSE"
icons = [
    "home=house", "settings", "search", "menu", "close=x", "check", "add=plus", "remove=minus",
    "delete=trash-2", "edit=pencil", "arrow_back=arrow-left", "arrow_forward=arrow-right",
    "arrow_upward=arrow-up", "arrow_downward=arrow-down", "chevron_left=chevron-left",
    "chevron_right=chevron-right", "expand_more=chevron-down", "expand_less=chevron-up",
    "more_vert=ellipsis-vertical", "more_horiz=ellipsis", "refresh=refresh-cw", "info",
    "warning=triangle-alert", "error=circle-alert", "help=circle-help", "notifications=bell",
    "favorite=heart", "star", "person=user", "lock", "lock_open=lock-open", "visibility=eye",
    "visibility_off=eye-off", "wifi", "bluetooth", "battery_full=battery-full",
    "battery_charging_full=battery-charging", "light_mode=sun", "dark_mode=moon", "palette",
    "volume_up=volume-2", "volume_off=volume-x", "play_arrow=play", "pause", "stop=square",
    "skip_next=skip-forward", "skip_previous=skip-back", "timer", "schedule=clock", "calendar_today=calendar",
    "mail", "call=phone", "chat=message-circle", "share=share-2", "download", "upload", "folder", "image",
    "photo_camera=camera", "map", "location_on=map-pin", "directions_car=car", "ev_station=plug-zap",
    "thermostat=thermometer", "water_drop=droplet", "sunny=sun-medium", "cloud", "bolt=zap",
    "power_settings_new=power", "logout=log-out", "login=log-in", "sync=refresh-ccw",
    "tune=sliders-horizontal", "filter_list=funnel", "sort=arrow-up-down", "list", "grid_view=layout-grid",
    "dashboard=layout-dashboard", "check_circle=circle-check", "cancel=circle-x",
    "radio_button_checked=circle-dot", "radio_button_unchecked=circle", "check_box=square-check",
    "check_box_outline_blank=square", "toggle_on=toggle-right", "toggle_off=toggle-left", "keyboard",
    "text_fields=type", "brightness_6=sun-dim", "language=globe", "translate=languages",
]

[[family]]
id = "phosphor"
name = "Phosphor"
role = "icons"
about = "Phosphor, the Regular weight (MIT)"
url = "https://raw.githubusercontent.com/phosphor-icons/web/master/src/regular/Phosphor.ttf"
codepoints_url = "https://raw.githubusercontent.com/phosphor-icons/web/master/src/regular/style.css"
