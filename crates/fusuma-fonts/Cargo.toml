[package]
name = "fusuma-fonts"
description = "The font families Fusuma can bundle and their presets, Latin subsets under the SIL Open Font License, one cargo feature each, for every renderer and platform; glyph atlases for microcontrollers"
readme = "README.md"
documentation = "https://docs.rs/fusuma-fonts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The code is MIT; the font files are under the SIL Open Font License 1.1, the icon fonts under Apache 2.0 (Material Symbols),
# ISC (Lucide) and MIT (Phosphor); their texts are in `fonts/`.
license = "MIT AND OFL-1.1 AND Apache-2.0 AND ISC"
authors.workspace = true
repository.workspace = true
keywords = ["fonts", "inter", "roboto", "embedded", "no-std"]
categories = ["gui", "embedded", "no-std"]
include = ["src/**", "fonts/**", "build.rs", "README.md", "LICENSE*"]

[features]
default = ["preset-fusuma"]
# Glyph atlases of the linked families: every glyph rasterised at build time to 4-bit coverage at a few line heights
# (`[fonts] sizes` in the app's fusuma.toml, which `FUSUMA_SETTINGS` names; else the catalog's 10, 15 and 20), for a
# renderer without a vector rasteriser (the integer one).
atlas = ["dep:ab_glyph"]

# One feature per family in fonts/catalog.toml (a test keeps the two in step). Sans families bring Regular and Bold.
inter = []
roboto = []
atkinson-hyperlegible = []
ibm-plex-sans = []
noto-sans = []
jetbrains-mono = []
roboto-mono = []
atkinson-hyperlegible-mono = []
ibm-plex-mono = []
noto-sans-mono = []
# Icons: Material Symbols Rounded, the catalog's 90 icons (17 KB), drawn by name (`FontSet::icon`). Apache 2.0.
material-symbols = []
# Opt-in icon families with the same icon names as Material Symbols (the catalog's aliases): line and outline styles.
lucide = []
phosphor = []

# Presets: a sans and a mono that go together (the catalog's `[[preset]]`).
preset-fusuma = ["inter", "jetbrains-mono"]
preset-material = ["roboto", "roboto-mono"]
preset-legible = ["atkinson-hyperlegible", "atkinson-hyperlegible-mono"]
preset-plex = ["ibm-plex-sans", "ibm-plex-mono"]
preset-noto = ["noto-sans", "noto-sans-mono"]
# Every family.
all-families = ["preset-fusuma", "preset-material", "preset-legible", "preset-plex", "preset-noto", "material-symbols"]

[build-dependencies]
serde.workspace = true
toml.workspace = true
ttf-parser.workspace = true
ab_glyph = { workspace = true, optional = true }

[lints]
workspace = true
