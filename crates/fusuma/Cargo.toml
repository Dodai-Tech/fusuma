[package]
name = "fusuma"
description = "Fusuma, a native Rust UI toolkit for screens from a microcontroller to a desktop: the one crate to add (toolkit, renderers and platform behind features)"
readme = "README.md"
documentation = "https://docs.rs/fusuma"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["gui", "toolkit", "embedded", "no-std", "vello"]
categories = ["gui", "embedded", "no-std"]

[features]
default = ["std", "renderer-vello-cpu", "fonts-fusuma"]
# The standard library. Without it the crate is `no_std` (the Vello renderers then need `libm`, see their README).
std = ["fusuma-render-vello-cpu?/std"]
# Software floating point (the `libm` crate) for the Vello renderers without `std`, on a chip with no FPU or no libm.
libm = ["fusuma-render-vello-cpu?/libm"]
# Reading renderer settings from TOML (`fusuma.toml`).
toml = ["fusuma-platform/toml"]
# Renderer backends, each linked only when asked for. The platform picks among those linked.
renderer-integer = ["dep:fusuma-render-embedded"]
renderer-vello-cpu = ["dep:fusuma-render-vello-cpu"]
renderer-vello-gpu = ["dep:fusuma-render-vello"]
# `fusuma::text`: Parley layout over the linked font families, for an app that lays out text itself.
text = ["dep:fusuma-text", "fonts", "fusuma-render-vello-cpu?/text", "fusuma-render-vello?/text"]
# Smooth text in every linked renderer (`fusuma::fonts`): the Vello ones draw the families from their outlines through
# Parley, the integer one from glyph atlases made at build time (no Parley). Which families: a `fonts-*` preset below,
# or `fusuma-fonts`' own features for single families; which of the linked ones draw: `[fonts]` in `fusuma.toml`.
fonts = [
    "dep:fusuma-fonts",
    "fusuma-render-vello-cpu?/text",
    "fusuma-render-vello?/text",
    "fusuma-render-embedded?/fonts",
]
# Inter and JetBrains Mono, the default.
fonts-fusuma = ["fonts", "fusuma-fonts/preset-fusuma"]
# Roboto and Roboto Mono, the Android and Material look.
fonts-material = ["fonts", "fusuma-fonts/preset-material"]
# Atkinson Hyperlegible Next and Mono, for small screens and low vision.
fonts-legible = ["fonts", "fusuma-fonts/preset-legible"]
# IBM Plex Sans and Mono.
fonts-plex = ["fonts", "fusuma-fonts/preset-plex"]
# Noto Sans and Noto Sans Mono.
fonts-noto = ["fonts", "fusuma-fonts/preset-noto"]
# Every family.
fonts-all = ["fonts", "fusuma-fonts/all-families"]
# Icons drawn like text (`Tree::icon`, `fonts::FontSet::icon`): Material Symbols Rounded, the catalog's 90 icons.
icons = ["fonts", "fusuma-fonts/material-symbols"]
# Lucide and Phosphor as icon families too (opt-in; `[fonts] icons = "lucide"` picks one): the same names as `icons`.
icons-lucide = ["fonts", "fusuma-fonts/lucide"]
icons-phosphor = ["fonts", "fusuma-fonts/phosphor"]
# `png()` for the CPU Vello renderer: the surface as a PNG file.
png = ["renderer-vello-cpu", "fusuma-render-vello-cpu/png"]

[dependencies]
fusuma-ui.workspace = true
fusuma-render.workspace = true
fusuma-anim.workspace = true
fusuma-cells.workspace = true
fusuma-platform.workspace = true
fusuma-text = { workspace = true, optional = true }
fusuma-fonts = { workspace = true, optional = true, default-features = false }
fusuma-render-embedded = { workspace = true, optional = true }
fusuma-render-vello-cpu = { workspace = true, optional = true }
fusuma-render-vello = { workspace = true, optional = true }

[lints]
workspace = true
