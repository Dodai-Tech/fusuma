[package]
name = "fusuma-platform-eink"
description = "Fusuma on e-paper and other reflective panels: one-bit quantising, batched refresh with the clean-up flashes, and the SSD1680, SSD1677 and SSD2677 controllers (and the reTerminal Sticky's two panels) over a small bus trait (no_std with alloc, host-testable)"
readme = "README.md"
documentation = "https://docs.rs/fusuma-platform-eink"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["gui", "e-paper", "e-ink", "embedded", "no-std"]
categories = ["gui", "embedded", "no-std"]
# Unpublished like fusuma-platform-embedded, which it draws through.
publish = false

[features]
default = []
# The standard library (a host test, ESP-IDF).
std = ["fusuma-platform-embedded/std"]
# Software floating point, needed by `vello-cpu` without `std`.
libm = ["fusuma-platform-embedded/libm"]
# Vello on the CPU next to the integer renderer.
vello-cpu = ["fusuma-platform-embedded/vello-cpu"]
# Smooth text (`EinkDriver::set_fonts`).
fonts = ["fusuma-platform-embedded/fonts"]

[dependencies]
fusuma-platform-embedded = { path = "../fusuma-platform-embedded" }
fusuma = { workspace = true, features = ["renderer-integer"] }

[dev-dependencies]
fusuma = { workspace = true, features = ["std", "renderer-integer", "renderer-vello-cpu"] }
fusuma-showcase = { path = "../../examples/showcase" }

[lints]
workspace = true
