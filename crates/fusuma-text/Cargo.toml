[package]
name = "fusuma-text"
description = "Fusuma text: Parley layout and measuring over the bundled fonts, with a cache, ready to draw as glyph runs (no_std with alloc)"
readme = "README.md"
documentation = "https://docs.rs/fusuma-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["text", "layout", "fonts", "parley", "no-std"]
categories = ["gui", "text-processing", "no-std"]

[features]
default = ["inter"]
# The bundled fonts (see `fusuma-fonts`): one feature each.
inter = ["fusuma-fonts/inter"]
inter-bold = ["fusuma-fonts/inter-bold"]
jetbrains-mono = ["fusuma-fonts/jetbrains-mono"]

[dependencies]
fusuma-render.workspace = true
fusuma-fonts = { workspace = true, default-features = false }
# `libm`, never `std`: Parley's `std` feature pulls `memmap2`, which does not build for ESP-IDF, and system fonts
# are not wanted here (the bundled ones are the point).
parley = { workspace = true }

[lints]
workspace = true
