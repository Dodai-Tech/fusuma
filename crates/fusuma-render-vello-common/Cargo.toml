[package]
name = "fusuma-render-vello-common"
description = "Shared code of the Fusuma Vello backends: the Renderer implementation, generic over a recording scene (CPU or GPU)"
readme = "README.md"
documentation = "https://docs.rs/fusuma-render-vello-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
# The standard library. Without it the crate is `no_std` with `alloc`, and needs `libm` for the
# floating-point maths (an ESP32-S3 or similar).
std = ["vello_common/std"]
libm = ["vello_common/libm"]
# Vector fonts through Parley for `draw_text` and `measure_text`, from the families `fusuma-fonts` links; without it,
# or for a role no linked family fills, text is the built-in bitmap font.
text = ["dep:fusuma-text"]

[dependencies]
fusuma-render.workspace = true
embedded-graphics.workspace = true
vello_common.workspace = true
fusuma-text = { workspace = true, optional = true }

[dev-dependencies]
fusuma-render = { workspace = true, features = ["conformance"] }

[lints]
workspace = true
