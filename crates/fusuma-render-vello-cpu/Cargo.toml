[package]
name = "fusuma-render-vello-cpu"
description = "Fusuma renderer backend for desktops, phones and watches without a GPU: anti-aliased CPU drawing on vello_cpu (SIMD, optionally multithreaded)"
readme = "README.md"
documentation = "https://docs.rs/fusuma-render-vello-cpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["std", "png"]
# The standard library. Without it the crate is `no_std` with `alloc`, and needs `libm`.
std = ["fusuma-render-vello-common/std", "vello_cpu/std"]
libm = ["fusuma-render-vello-common/libm", "vello_cpu/libm"]
# `png()`: the surface as a PNG file.
png = ["std", "vello_cpu/png"]

[dependencies]
fusuma-render.workspace = true
fusuma-render-vello-common.workspace = true
vello_cpu.workspace = true

[dev-dependencies]
fusuma-render = { workspace = true, features = ["conformance"] }

[lints]
workspace = true
