[package]
name = "fusuma-render-vello-cpu"
description = "Fusuma renderer backend for desktops, phones and watches without a GPU: anti-aliased CPU drawing on vello_cpu (SIMD, optionally multithreaded)"
readme = "README.md"
documentation = "https://docs.rs/fusuma-render-vello-cpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["std", "png"]
# The standard library. Without it the crate is `no_std` with `alloc`, and needs `libm`.
std = ["fusuma-render-vello-common/std", "vello_cpu/std"]
libm = ["fusuma-render-vello-common/libm", "vello_cpu/libm"]
# `png()`: the surface as a PNG file.
png = ["std", "vello_cpu/png"]
# Vector fonts for `draw_text` and `measure_text`, from the families `fusuma-fonts` links (an app turns them on
# there, or through the `fusuma` facade's `fonts-*` features).
text = ["fusuma-render-vello-common/text", "vello_cpu/text", "dep:fusuma-text"]

[dependencies]
fusuma-render.workspace = true
fusuma-render-vello-common.workspace = true
vello_cpu.workspace = true
fusuma-text = { workspace = true, optional = true }

[dev-dependencies]
fusuma-fonts = { workspace = true, features = ["preset-fusuma", "material-symbols", "lucide", "phosphor"] }
fusuma-render = { workspace = true, features = ["conformance"] }
fusuma-render-embedded.workspace = true

[lints]
workspace = true
