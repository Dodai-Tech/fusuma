[package]
name = "fusuma-icons"
description = "Every Lucide icon for Fusuma: the icon font, each icon by name and as a constant, ready to draw on any renderer and platform"
readme = "README.md"
documentation = "https://docs.rs/fusuma-icons"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The code is MIT; the Lucide font is ISC (with parts MIT from Feather), its text is in `fonts/LICENSE-lucide.txt`.
license = "MIT AND ISC"
authors.workspace = true
repository.workspace = true
keywords = ["icons", "lucide", "gui", "embedded", "no-std"]
categories = ["gui", "embedded", "no-std"]
include = ["src/**", "fonts/**", "README.md", "LICENSE*"]

[dependencies]
fusuma-fonts.workspace = true

[lints]
workspace = true
