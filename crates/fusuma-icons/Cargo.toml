[package]
name = "fusuma-icons"
description = "Every Lucide icon for Fusuma as a typed enum, with the icon font and, for microcontrollers, glyph atlases of the icons an app uses"
readme = "README.md"
documentation = "https://docs.rs/fusuma-icons"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The code is MIT; the Lucide font is ISC (with parts MIT from Feather), its text is in `fonts/LICENSE-lucide.txt`.
license = "MIT AND ISC"
authors.workspace = true
repository.workspace = true
keywords = ["icons", "lucide", "gui", "embedded", "no-std"]
categories = ["gui", "embedded", "no-std"]
include = ["src/**", "fonts/**", "build.rs", "README.md", "LICENSE*"]

[features]
default = []
# Glyph atlases of the icons an app uses (the toolkit's own and `[icons] used` in the file `FUSUMA_SETTINGS` names), at the
# line heights `[fonts] sizes` gives, for a renderer without a vector rasteriser (the integer one).
atlas = ["dep:ab_glyph", "dep:fusuma-atlas", "dep:serde", "dep:toml"]

[dependencies]
fusuma-atlas = { workspace = true, optional = true }

[build-dependencies]
ab_glyph = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
toml = { workspace = true, optional = true }

[lints]
workspace = true
