[package]
name = "fusuma-render"
description = "A small, no_std renderer abstraction: shapes, paths, text, images, clip and translate behind one trait"
readme = "README.md"
documentation = "https://docs.rs/fusuma-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# The built-in bitmap fonts (Latin-1 in three sizes), shared by the backends that draw them.
bitmap = ["dep:embedded-graphics"]
# Also Romanian and Central European (ISO 8859-16 and 2), Cyrillic (8859-5) and Greek (8859-7), picked a character at a time: about
# 100 KB of flash more, which is why it is off.
bitmap-extended = ["bitmap"]
# The shared test-suite every backend must pass (`fusuma_render::conformance`).
conformance = []

[dependencies]
embedded-graphics = { workspace = true, optional = true }

[lints]
workspace = true
