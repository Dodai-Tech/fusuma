[package]
name = "fusuma-showcase-esp"
description = "The Fusuma components showcase on ESP32 boards, one board per build: FUSUMA_BOARD names its board file (see scripts/showcase.nu)"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Sorin Albu-Irimies"]
publish = false

# Not a member of the Fusuma workspace: it needs the ESP toolchain, and each board its own target (see
# ../../scripts/showcase.nu, which picks the board from the chip that is connected).
[workspace]

[[bin]]
name = "fusuma-showcase-esp"
harness = false

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
debug = true
opt-level = "s"

[dependencies]
fusuma-showcase = { path = "../showcase", default-features = false }
fusuma-platform-esp = { path = "../../crates/fusuma-platform-esp" }
anyhow = "1"
# Direct, so the build script sees esp-idf-sys and passes the linker arguments on.
esp-idf-svc = { version = "0.53", features = ["experimental"] }

[features]
# Ask the build for a renderer (the strongest layer of the choice). With none, the board's hardware decides.
# If several are on, the lightest wins.
render-integer = []
# Vello and its fonts are linked only for this one: the automatic choice is the integer renderer on every ESP chip.
render-vello-cpu = ["fusuma-platform-esp/vello-cpu", "fusuma-platform-esp/fonts", "fusuma-showcase/fonts"]

[build-dependencies]
embuild = "0.33"

# Fusuma's ESP drivers, one per controller; the board file decides which ones run.
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["../../crates/fusuma-platform-esp/components/fusuma_esp"]
bindings_header = "../../crates/fusuma-platform-esp/components/fusuma_esp/include/fusuma_esp.h"
bindings_module = "fusuma_esp"
