# One firmware crate, one target per board. The target, the toolchain, `MCU` and the sdkconfig come from
# `nu scripts/showcase.nu`, which picks them for the board; building here by hand needs the same.

[target.riscv32imafc-esp-espidf]
linker = "ldproxy"
rustflags = ["--cfg", "espidf_time64", "-Alinker_messages"]

[target.riscv32imac-esp-espidf]
linker = "ldproxy"
rustflags = ["--cfg", "espidf_time64", "-Alinker_messages"]

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
rustflags = ["--cfg", "espidf_time64", "-Alinker_messages"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
ESP_IDF_VERSION = "v5.5.6"
ESP_IDF_TOOLS_INSTALL_DIR = "global"
