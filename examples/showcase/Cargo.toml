[package]
name = "fusuma-showcase"
description = "A Fusuma components showcase: one app, drawn on a host window-less renderer or flashed on a board"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
fusuma = { workspace = true, features = ["font-inter", "font-inter-bold", "font-jetbrains-mono"] }

[dev-dependencies]
fusuma = { workspace = true, features = ["std", "png"] }

[lints]
workspace = true
