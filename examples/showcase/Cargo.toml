[package]
name = "fusuma-showcase"
description = "A Fusuma components showcase: one app, drawn on a host window-less renderer or flashed on a board"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
default = ["fonts"]
# Vector fonts (Inter, Inter Bold, JetBrains Mono). Without them text is the built-in bitmap font: for a chip that
# draws with the integer renderer.
fonts = ["fusuma/fonts-fusuma"]

[dependencies]
fusuma.workspace = true

[dev-dependencies]
fusuma = { workspace = true, features = ["std", "png"] }

[lints]
workspace = true
