[package]
name = "fusuma-showcase"
description = "A Fusuma components showcase: one app, drawn on a host window-less renderer or flashed on a board"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
default = ["fonts"]
# Smooth text (Inter, Inter Bold, JetBrains Mono) and icons (Material Symbols). Without them text is the built-in
# bitmap font and the icons row is left out.
fonts = ["fusuma/fonts-fusuma", "fusuma/icons"]

[dependencies]
fusuma.workspace = true

[dev-dependencies]
fusuma = { workspace = true, features = ["std", "png"] }

[lints]
workspace = true
