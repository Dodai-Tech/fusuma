[package]
name = "fusuma-showcase-p4"
description = "The Fusuma components showcase on the Waveshare ESP32-P4 7-inch touch board (1024x600), drawn with vello_cpu"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Sorin Albu-Irimies"]
publish = false

# Not a member of the Fusuma workspace: it needs the ESP toolchain (see ../../scripts/showcase.nu).
[workspace]

[[bin]]
name = "fusuma-showcase-p4"
harness = false

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
debug = true
opt-level = "s"

[dependencies]
fusuma-showcase = { path = "../showcase" }
fusuma-platform-esp = { path = "../../crates/fusuma-platform-esp" }
anyhow = "1"
# Direct, so the build script sees esp-idf-sys and passes the linker arguments on.
esp-idf-svc = { version = "0.53", features = ["experimental"] }

[features]
# Ask the build for a renderer (the strongest layer of the choice). With none, the board's hardware decides.
# If several are on, the lightest wins.
render-integer = []
render-skia = []
render-vello-cpu = []

[build-dependencies]
embuild = "0.33"

# The platform crate's C shim: MIPI-DSI panel (EK79007), backlight and GT911 touch.
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["../../crates/fusuma-platform-esp/components"]
bindings_header = "../../crates/fusuma-platform-esp/components/wt_display/include/wt_display.h"
bindings_module = "wt_display"
