[package]
name = "fusuma-showcase-web"
description = "The Fusuma components showcase in a web page: one canvas, drawn by Vello on the CPU from WebAssembly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fusuma-showcase = { path = "../showcase" }
fusuma = { path = "../../crates/fusuma", features = ["std", "toml", "renderer-vello-cpu", "fonts-fusuma", "icons"] }
wasm-bindgen = "=0.2.130"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlTextAreaElement",
    "CanvasRenderingContext2d", "ImageData", "CssStyleDeclaration", "DomRect",
    "MouseEvent", "WheelEvent", "KeyboardEvent", "TouchEvent", "TouchList", "Touch", "InputEvent",
    "CompositionEvent", "ClipboardEvent", "DataTransfer", "Event", "EventTarget", "FocusEvent",
    "AddEventListenerOptions", "Performance", "console", "Navigator", "Clipboard",
]

[lints]
workspace = true
