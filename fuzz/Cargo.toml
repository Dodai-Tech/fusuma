[package]
name = "fusuma-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
fusuma-render = { path = "../crates/fusuma-render" }
fusuma-anim = { path = "../crates/fusuma-anim" }
fusuma-ui = { path = "../crates/fusuma-ui" }
fusuma-render-integer = { path = "../crates/fusuma-render-integer" }
fusuma-render-vello-cpu = { path = "../crates/fusuma-render-vello-cpu" }
fusuma-platform-embedded = { path = "../crates/fusuma-platform-embedded" }
fusuma = { path = "../crates/fusuma" }

# Not part of the main workspace (needs nightly).
[workspace]

[[bin]]
name = "geometry"
path = "fuzz_targets/geometry.rs"
test = false
doc = false
bench = false

[[bin]]
name = "draw"
path = "fuzz_targets/draw.rs"
test = false
doc = false
bench = false

[[bin]]
name = "anim"
path = "fuzz_targets/anim.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ui"
path = "fuzz_targets/ui.rs"
test = false
doc = false
bench = false

[[bin]]
name = "eink"
path = "fuzz_targets/eink.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dates"
path = "fuzz_targets/dates.rs"
test = false
doc = false
bench = false
