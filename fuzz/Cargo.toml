[package]
name = "fusuma-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
fusuma-render = { path = "../crates/fusuma-render" }
fusuma-render-embedded = { path = "../crates/fusuma-render-embedded" }
fusuma-render-skia = { path = "../crates/fusuma-render-skia" }

# Not part of the main workspace (needs nightly).
[workspace]

[[bin]]
name = "geometry"
path = "fuzz_targets/geometry.rs"
test = false
doc = false
bench = false

[[bin]]
name = "draw"
path = "fuzz_targets/draw.rs"
test = false
doc = false
bench = false
