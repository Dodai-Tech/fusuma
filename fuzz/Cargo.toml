[package]
name = "fusuma-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
fusuma-render = { path = "../crates/fusuma-render" }
fusuma-anim = { path = "../crates/fusuma-anim" }
fusuma-core = { path = "../crates/fusuma-core" }
fusuma-render-embedded = { path = "../crates/fusuma-render-embedded" }
fusuma-render-vello-cpu = { path = "../crates/fusuma-render-vello-cpu" }

# Not part of the main workspace (needs nightly).
[workspace]

[[bin]]
name = "geometry"
path = "fuzz_targets/geometry.rs"
test = false
doc = false
bench = false

[[bin]]
name = "draw"
path = "fuzz_targets/draw.rs"
test = false
doc = false
bench = false

[[bin]]
name = "anim"
path = "fuzz_targets/anim.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ui"
path = "fuzz_targets/ui.rs"
test = false
doc = false
bench = false
