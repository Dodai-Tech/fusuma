name: CI

on:
  pull_request:
  push:
    branches: [main, master, develop]
  # The gate also runs on what a merge queue is about to merge, so main is never red.
  merge_group:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Also test on macOS and Windows (automatic on public repos)
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # fmt + clippy + tests + versions + nu tests —
  # the same script `just check-all` runs.
  gate:
    name: quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - uses: hustcer/setup-nu@v3
        with:
          version: "0.116.1"
      - name: Install system packages
        run: nu scripts/ci/apt.nu
      - name: Quality gate
        run: nu scripts/ci/quality_gate.nu

  # Users build on all three systems: paths and line endings differ there.
  test:
    name: test (${{ matrix.os }})
    # A private repo pays 10x for macOS and 2x for Windows minutes: there this
    # runs only when dispatched with full_matrix.
    if: ${{ !github.event.repository.private || inputs.full_matrix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace
        run: cargo test --workspace --all-features


  # The design files (OpenPencil / Figma): the .fig is built from the tracked tokens and must carry them, by name and value.
  design:
    name: design files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: hustcer/setup-nu@v3
        with:
          version: "0.116.1"
      - uses: oven-sh/setup-bun@v2
      - name: Install system packages
        run: nu scripts/ci/apt.nu
      - name: Tokens and spec are up to date
        run: nu scripts/design.nu check
      - name: Build the .fig
        run: nu scripts/design.nu build
      - name: The .fig carries the tokens
        run: nu scripts/design.nu verify
      - uses: actions/upload-artifact@v4
        with:
          name: fusuma-design
          path: dist/design/fusuma.fig

  # The showcase compiles to WebAssembly and gets its JavaScript glue: one canvas, Vello on the CPU.
  web:
    name: web build (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: hustcer/setup-nu@v3
        with:
          version: "0.116.1"
      - name: Install wasm-bindgen
        run: nu scripts/web.nu install
      - name: Build the web showcase
        run: nu scripts/web.nu build

  msrv:
    name: MSRV (1.90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # @master + toolchain, not @1.90: Dependabot would bump a version ref.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
      - uses: Swatinem/rust-cache@v2
      - uses: hustcer/setup-nu@v3
        with:
          version: "0.116.1"
      - name: Install system packages
        run: nu scripts/ci/apt.nu
      - name: cargo check
        run: cargo check --workspace --locked
