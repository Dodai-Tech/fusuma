[workspace]
resolver = "3"
members = [
    "crates/fusuma-render",
    "crates/fusuma-render-embedded",
    "crates/fusuma-anim",
    "crates/fusuma",
    "crates/fusuma-render-vello-common",
    "crates/fusuma-render-vello-cpu",
    "crates/fusuma-render-vello",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Sorin Albu-Irimies"]
repository = "https://github.com/Dodai-Tech/fusuma"
keywords = ["graphics", "renderer", "embedded", "no-std", "2d"]
categories = ["graphics", "embedded", "no-std", "rendering"]

[workspace.dependencies]
fusuma-render = { path = "crates/fusuma-render", version = "0.2.0" }
fusuma-render-embedded = { path = "crates/fusuma-render-embedded", version = "0.2.0" }
embedded-graphics = "0.8.2"
fusuma-render-vello-cpu = { path = "crates/fusuma-render-vello-cpu", version = "0.2.0" }
vello_gpu = { version = "0.4", default-features = false, features = ["wgpu", "wgpu_default", "full_image_support"] }
pollster = "1"
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "vulkan", "metal", "dx12", "gles"] }
fusuma-anim = { path = "crates/fusuma-anim", version = "0.2.0" }
fusuma-render-vello-common = { path = "crates/fusuma-render-vello-common", version = "0.2.0", default-features = false }
vello_common = { version = "0.4", default-features = false }
vello_cpu = { version = "0.4", default-features = false, features = ["u8_pipeline"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
