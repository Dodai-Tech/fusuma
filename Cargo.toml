[workspace]
resolver = "3"
members = [
    "crates/fusuma-render",
    "crates/fusuma-render-embedded",
    "crates/fusuma-anim",
    "crates/fusuma",
    "crates/fusuma-ui",
    "crates/fusuma-fonts",
    "crates/fusuma-text",
    "crates/fusuma-platform",
    "crates/fusuma-platform-desktop",
    "crates/fusuma-platform-embedded",
    "crates/fusuma-cells",
    "crates/fusuma-platform-tui",
    "crates/fusuma-platform-console",
    "crates/fusuma-cells-panel",
    "crates/fusuma-view",
    "crates/fusuma-test",
    "crates/fusuma-palette",
    "crates/fusuma-render-vello-common",
    "crates/fusuma-render-vello-cpu",
    "crates/fusuma-render-vello",
    "examples/showcase",
    "examples/showcase-desktop",
    "examples/showcase-tui",
    "examples/showcase-web",
]

# The firmware needs the ESP toolchain, so it builds on its own (scripts/showcase.nu).
exclude = ["examples/showcase-esp", "crates/fusuma-platform-esp"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Sorin Albu-Irimies"]
repository = "https://github.com/Dodai-Tech/fusuma"
keywords = ["graphics", "renderer", "embedded", "no-std", "2d"]
categories = ["graphics", "embedded", "no-std", "rendering"]

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive", "std"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
ab_glyph = "0.2"
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
fusuma-render = { path = "crates/fusuma-render", version = "0.2.0" }
fusuma-render-embedded = { path = "crates/fusuma-render-embedded", version = "0.2.0" }
embedded-graphics = "0.8.2"
fusuma-render-vello = { path = "crates/fusuma-render-vello", version = "0.2.0" }
fusuma-render-vello-cpu = { path = "crates/fusuma-render-vello-cpu", version = "0.2.0", default-features = false }
vello_gpu = { version = "0.4", default-features = false, features = ["wgpu", "wgpu_default", "full_image_support"] }
pollster = "1"
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "vulkan", "metal", "dx12", "gles"] }
fusuma-ui = { path = "crates/fusuma-ui", version = "0.2.0" }
fusuma-platform = { path = "crates/fusuma-platform", version = "0.2.0" }
fusuma = { path = "crates/fusuma", version = "0.2.0", default-features = false }
fusuma-fonts = { path = "crates/fusuma-fonts", version = "0.2.0", default-features = false }
fusuma-text = { path = "crates/fusuma-text", version = "0.2.0", default-features = false }
parley = { version = "0.13", default-features = false, features = ["libm"] }
fusuma-anim = { path = "crates/fusuma-anim", version = "0.2.0" }
fusuma-cells = { path = "crates/fusuma-cells", version = "0.2.0" }
fusuma-view = { path = "crates/fusuma-view", version = "0.2.0" }
fusuma-render-vello-common = { path = "crates/fusuma-render-vello-common", version = "0.2.0", default-features = false }
vello_common = { version = "0.4", default-features = false }
vello_cpu = { version = "0.4", default-features = false, features = ["u8_pipeline"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
